<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Survey — FSDA Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:  #0A3D2B;
      --green:       #1D7A52;
      --green-light: #EEF9F3;
      --green-muted: rgba(29,122,82,0.14);
      --amber:       #D97706;
      --stone-50:    #FAFAF7;
      --stone-100:   #F4F1EA;
      --stone-200:   #E8E3D8;
      --stone-300:   #D4CDB8;
      --stone-400:   #A89E89;
      --stone-500:   #78716C;
      --stone-600:   #5C5340;
      --stone-700:   #3D3828;
      --stone-900:   #1C1917;
      --border:      #EDE9E0;
      --surface:     #FFFFFF;
      --bg:          #F7F6F2;
      --error:       #DC2626;
      --error-bg:    #FEE2E2;
      --success:     #059669;
      --success-bg:  #D1FAE5;
      --r-sm:        6px;
      --r-md:        10px;
      --r-lg:        14px;
      --r-xl:        18px;
      --shadow-sm:   0 2px 4px rgba(28,25,23,0.06);
      --shadow-md:   0 4px 12px rgba(28,25,23,0.10);
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--stone-900);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Header banner ── */
    .survey-header {
      background: linear-gradient(160deg, var(--green-dark) 0%, var(--green) 100%);
      padding: 24px 20px 32px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .survey-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .survey-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* Progress bar */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #fff;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── Container ── */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    /* ── Question card ── */
    .question-card {
      background: var(--surface);
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s;
    }

    .question-card:focus-within {
      box-shadow: 0 0 0 2px var(--green), var(--shadow-sm);
    }

    .question-card.answered { border-color: rgba(29,122,82,0.3); }

    .question-accent {
      height: 3px;
      background: var(--stone-300);
      transition: background 0.3s;
    }

    .question-card.answered .question-accent { background: var(--green); }
    .question-card.required-error .question-accent { background: var(--error); }

    .question-inner { padding: 14px 16px 16px; }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .badge-num {
      background: var(--green-light);
      color: var(--green);
    }

    .badge-type {
      background: var(--stone-100);
      color: var(--stone-500);
    }

    .badge-required {
      background: #FEE2E2;
      color: var(--error);
    }

    .badge-category {
      background: #EFF6FF;
      color: #2563EB;
    }

    .question-text {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(14px, 3.5vw, 16px);
      font-weight: 600;
      color: var(--stone-900);
      line-height: 1.45;
      margin-bottom: 14px;
    }

    /* ── Input styles ── */
    .input-field {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--stone-300);
      border-radius: var(--r-md);
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--stone-900);
      background: var(--surface);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      -webkit-appearance: none;
    }

    .input-field:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(29,122,82,0.1);
    }

    textarea.input-field {
      min-height: 100px;
      resize: vertical;
      line-height: 1.5;
    }

    /* ── Choice options ── */
    .choice-group { display: flex; flex-direction: column; gap: 8px; }

    .choice-option {
      display: flex;
      align-items: center;
      padding: 11px 14px;
      border: 1.5px solid var(--stone-300);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: all 0.18s;
      gap: 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .choice-option:hover {
      border-color: var(--green);
      background: rgba(29,122,82,0.04);
    }

    .choice-option.selected {
      border-color: var(--green);
      background: var(--green-light);
    }

    /* Custom radio / checkbox indicator */
    .choice-indicator {
      width: 18px;
      height: 18px;
      border-radius: 9px;
      border: 2px solid var(--stone-300);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
    }

    .choice-option.selected .choice-indicator {
      border-color: var(--green);
      background: var(--green);
    }

    .choice-indicator::after {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: transparent;
      transition: background 0.18s;
    }

    .choice-option.selected .choice-indicator::after { background: #fff; }

    .choice-indicator.checkbox { border-radius: 5px; }

    .choice-indicator.checkbox::after {
      content: '';
      width: 10px;
      height: 7px;
      border: none;
      background: transparent;
      border-radius: 0;
    }

    .choice-option.selected .choice-indicator.checkbox::after {
      content: '✓';
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      background: transparent;
      border-radius: 0;
      width: auto;
      height: auto;
    }

    .choice-label {
      font-size: 14px;
      color: var(--stone-700);
      line-height: 1.4;
    }

    .choice-option.selected .choice-label {
      color: var(--green);
      font-weight: 500;
    }

    /* Hidden native input */
    .choice-option input[type="radio"],
    .choice-option input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* ── Scale rating grid ── */
    .scale-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .scale-tile {
      width: 44px;
      height: 44px;
      border-radius: var(--r-md);
      border: 1.5px solid var(--stone-300);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--stone-500);
      cursor: pointer;
      transition: all 0.18s;
    }

    .scale-tile:hover { border-color: var(--green); color: var(--green); }

    .scale-tile.selected {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    /* ── Validation error ── */
    .field-error {
      font-size: 12px;
      color: var(--error);
      margin-top: 6px;
      display: none;
    }

    .question-card.required-error .field-error { display: block; }

    /* ── Submit zone ── */
    .submit-zone {
      background: var(--surface);
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
      padding: 20px;
      margin-top: 6px;
      box-shadow: var(--shadow-sm);
    }

    .submit-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .submit-count {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--green);
    }

    .submit-label {
      font-size: 11px;
      color: var(--stone-400);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: var(--r-md);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover { background: #155e3c; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .submit-footer {
      text-align: center;
      font-size: 11px;
      color: var(--stone-400);
      margin-top: 12px;
    }

    /* ── Full-page states ── */
    .full-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .state-card {
      background: var(--surface);
      border-radius: var(--r-xl);
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .state-title {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--stone-900);
      margin-bottom: 10px;
    }

    .state-body {
      font-size: 14px;
      color: var(--stone-500);
      line-height: 1.6;
    }

    .state-title.error { color: var(--error); }
    .state-title.success { color: var(--green); }

    /* ── Consent screen ── */
    .consent-section {
      background: var(--green-light);
      border: 1px solid rgba(29,122,82,0.2);
      border-radius: var(--r-lg);
      padding: 18px;
      margin-bottom: 20px;
      text-align: left;
    }

    .consent-section h3 {
      font-family: 'Fraunces', serif;
      font-size: 15px;
      color: var(--green);
      margin-bottom: 8px;
    }

    .consent-section p {
      font-size: 13px;
      color: var(--stone-600);
      line-height: 1.6;
    }

    .consent-check {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 14px;
      cursor: pointer;
    }

    .consent-check input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    .consent-check label {
      font-size: 13px;
      color: var(--stone-700);
      cursor: pointer;
      line-height: 1.5;
    }

    .start-btn {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: var(--r-md);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .start-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .start-btn:not(:disabled):hover { background: #155e3c; }

    /* ── Spinner ── */
    .spinner-wrap { text-align: center; padding: 80px 20px; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(29,122,82,0.15);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner-text {
      font-size: 14px;
      color: var(--stone-400);
    }

    /* ── Responsive ── */
    @media (min-width: 600px) {
      .container { padding: 24px 24px 100px; }
      .scale-tile { width: 52px; height: 52px; font-size: 16px; }
      .survey-header { padding: 28px 32px 36px; }
    }

    @media (min-width: 900px) {
      .container { padding: 32px 32px 100px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="full-screen">
      <div class="spinner-wrap">
        <div class="spinner"></div>
        <p class="spinner-text">Loading survey…</p>
      </div>
    </div>
  </div>

  <script>
    // ── Config ───────────────────────────────────────────────────────────────
    const API_BASE_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:8000/api/v1'
      : '/api/v1';

    const urlPath = window.location.pathname;
    const token = (urlPath.split('/respond/')[1] || new URLSearchParams(window.location.search).get('token') || '').replace(/\/$/, '');

    // ── State ─────────────────────────────────────────────────────────────────
    let linkData     = null;
    let questions    = [];
    let responses    = {};   // { questionId: value }
    let consentGiven = false;

    // ── Bootstrap ─────────────────────────────────────────────────────────────
    async function init() {
      if (!token) { showError('Invalid survey link. Please check the URL and try again.'); return; }
      try {
        const [linkRes, qRes] = await Promise.all([
          fetch(`${API_BASE_URL}/public/links/${token}/`),
          fetch(`${API_BASE_URL}/public/links/${token}/questions/`),
        ]);
        const linkResult = await linkRes.json();
        const qResult    = await qRes.json();

        if (!linkResult.success || !linkResult.is_valid) { showExpired(); return; }
        if (!qResult.success) { showError('Failed to load survey questions.'); return; }

        linkData  = linkResult.link;
        questions = qResult.questions || [];
        showConsentScreen();
      } catch (e) {
        showError('Failed to load survey. Please check your internet connection and try again.');
      }
    }

    // ── Consent screen ────────────────────────────────────────────────────────
    function showConsentScreen() {
      document.getElementById('app').innerHTML = `
        <div class="full-screen" style="background:var(--bg);align-items:flex-start;padding-top:0;">
          <div style="width:100%;max-width:640px;margin:0 auto;">
            <!-- Mini header -->
            <div class="survey-header" style="position:relative;">
              <div class="header-brand">
                <div class="brand-icon">🌿</div>
                <span class="brand-name">FSDA Research</span>
              </div>
              <div class="survey-title">${escHtml(linkData.title || 'Survey')}</div>
              ${linkData.description ? `<div class="survey-desc">${escHtml(linkData.description)}</div>` : ''}
              <div style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:4px;">${questions.length} question${questions.length !== 1 ? 's' : ''} · Estimated 5–10 min</div>
            </div>
            <div style="padding:20px 16px;">
              <div class="consent-section">
                <h3>Informed Consent</h3>
                <p>By participating in this survey you consent to the collection and use of your responses for research purposes. Your responses will be kept confidential and used only for the stated research objectives.</p>
                <label class="consent-check">
                  <input type="checkbox" id="consentCheck" onchange="handleConsent(this.checked)">
                  <label for="consentCheck">I have read and understood the above information, and I consent to participate in this survey.</label>
                </label>
              </div>
              <button class="start-btn" id="startBtn" disabled onclick="startSurvey()">
                Start Survey (${questions.length} questions)
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function handleConsent(checked) {
      consentGiven = checked;
      document.getElementById('startBtn').disabled = !checked;
    }

    function startSurvey() {
      if (!consentGiven) return;
      showAllQuestions();
    }

    // ── All-questions view ────────────────────────────────────────────────────
    function showAllQuestions() {
      const answered = countAnswered();
      const total    = questions.length;

      const questionsHtml = questions.map((q, idx) => buildQuestionCard(q, idx)).join('');

      document.getElementById('app').innerHTML = `
        <div>
          <!-- Sticky header -->
          <div class="survey-header">
            <div class="header-brand">
              <div class="brand-icon">🌿</div>
              <span class="brand-name">FSDA Research</span>
            </div>
            <div class="survey-title">${escHtml(linkData.title || 'Survey')}</div>
            <div class="progress-wrap">
              <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width:${pct(answered,total)}%"></div>
              </div>
              <span class="progress-label" id="progressLabel">${answered} / ${total} answered</span>
            </div>
          </div>

          <!-- Questions -->
          <div class="container">
            ${questionsHtml}

            <!-- Submit zone -->
            <div class="submit-zone">
              <div class="submit-summary">
                <div>
                  <div class="submit-count" id="submitCount">${answered}/${total}</div>
                  <div class="submit-label">Questions Answered</div>
                </div>
                <div style="font-size:13px;color:var(--stone-400);text-align:right;">
                  ${requiredCount()} required
                </div>
              </div>
              <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">
                ✓ Submit Responses
              </button>
              <p class="submit-footer">Powered by FSDA · Your responses are confidential</p>
            </div>
          </div>
        </div>
      `;

      // Attach event listeners after render
      questions.forEach((q) => attachListeners(q));
      updateProgress();
    }

    // ── Build a question card ─────────────────────────────────────────────────
    function buildQuestionCard(q, idx) {
      const isAnswered = !!responses[q.id];
      return `
        <div class="question-card${isAnswered ? ' answered' : ''}" id="qcard-${q.id}">
          <div class="question-accent"></div>
          <div class="question-inner">
            <div class="question-meta">
              <span class="badge badge-num">Q${idx + 1}</span>
              ${q.question_category ? `<span class="badge badge-category">${escHtml(q.question_category)}</span>` : ''}
              <span class="badge badge-type">${formatType(q.response_type)}</span>
              ${q.is_required ? '<span class="badge badge-required">Required</span>' : ''}
            </div>
            <div class="question-text">${escHtml(q.question_text)}</div>
            <div id="qinput-${q.id}">${buildInput(q)}</div>
            <div class="field-error" id="qerr-${q.id}">This question is required.</div>
          </div>
        </div>
      `;
    }

    // ── Build input HTML ──────────────────────────────────────────────────────
    function buildInput(q) {
      const current = responses[q.id] || '';
      const type    = q.response_type;

      if (type === 'text_short' || type === 'text') {
        return `<input type="text" class="input-field" data-qid="${q.id}" value="${escAttr(current)}" placeholder="Type your answer here…" autocomplete="off">`;
      }

      if (type === 'text_long') {
        return `<textarea class="input-field" data-qid="${q.id}" placeholder="Type your answer here…" autocomplete="off">${escHtml(current)}</textarea>`;
      }

      if (type === 'numeric_integer' || type === 'numeric' || type === 'numeric_decimal' || type === 'scale') {
        const step = type === 'numeric_decimal' ? '0.01' : '1';
        return `<input type="number" class="input-field" data-qid="${q.id}" value="${escAttr(current)}" step="${step}" placeholder="Enter a number…" autocomplete="off">`;
      }

      if (type === 'scale_rating') {
        const max = q.max_value || 10;
        const min = q.min_value || 1;
        let tiles = '<div class="scale-grid">';
        for (let i = min; i <= max; i++) {
          const sel = String(current) === String(i) ? ' selected' : '';
          tiles += `<div class="scale-tile${sel}" data-qid="${q.id}" data-val="${i}" onclick="selectScale(this)">${i}</div>`;
        }
        tiles += '</div>';
        return tiles;
      }

      if (type === 'choice_single' || type === 'single_choice') {
        const opts = q.options || q.response_options || q.choices || [];
        if (!opts.length) {
          return `<input type="text" class="input-field" data-qid="${q.id}" value="${escAttr(current)}" placeholder="Type your answer here…">`;
        }
        return '<div class="choice-group">' + opts.map(opt => {
          const sel = current === opt ? ' selected' : '';
          return `
            <label class="choice-option${sel}" data-qid="${q.id}" data-val="${escAttr(opt)}" onclick="selectChoice(this,'radio')">
              <input type="radio" name="r-${q.id}" value="${escAttr(opt)}" ${sel ? 'checked' : ''}>
              <div class="choice-indicator"></div>
              <span class="choice-label">${escHtml(opt)}</span>
            </label>`;
        }).join('') + '</div>';
      }

      if (type === 'choice_multiple' || type === 'multiple_choice') {
        const opts = q.options || q.response_options || q.choices || [];
        const selected = current ? current.split(',') : [];
        return '<div class="choice-group">' + opts.map(opt => {
          const sel = selected.includes(opt) ? ' selected' : '';
          return `
            <label class="choice-option${sel}" data-qid="${q.id}" data-val="${escAttr(opt)}" onclick="toggleCheckbox(this)">
              <input type="checkbox" name="c-${q.id}" value="${escAttr(opt)}" ${sel ? 'checked' : ''}>
              <div class="choice-indicator checkbox"></div>
              <span class="choice-label">${escHtml(opt)}</span>
            </label>`;
        }).join('') + '</div>';
      }

      if (type === 'boolean') {
        return `
          <div class="choice-group">
            <label class="choice-option${current === 'true' ? ' selected' : ''}" data-qid="${q.id}" data-val="true" onclick="selectChoice(this,'radio')">
              <input type="radio" name="r-${q.id}" value="true" ${current === 'true' ? 'checked' : ''}>
              <div class="choice-indicator"></div>
              <span class="choice-label">Yes</span>
            </label>
            <label class="choice-option${current === 'false' ? ' selected' : ''}" data-qid="${q.id}" data-val="false" onclick="selectChoice(this,'radio')">
              <input type="radio" name="r-${q.id}" value="false" ${current === 'false' ? 'checked' : ''}>
              <div class="choice-indicator"></div>
              <span class="choice-label">No</span>
            </label>
          </div>`;
      }

      // Fallback
      return `<input type="text" class="input-field" data-qid="${q.id}" value="${escAttr(current)}" placeholder="Type your answer here…">`;
    }

    // ── Interaction handlers ──────────────────────────────────────────────────
    function selectChoice(el, type) {
      const qid = el.dataset.qid;
      const val = el.dataset.val;
      // Deselect siblings
      el.closest('.choice-group').querySelectorAll('.choice-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      const inp = el.querySelector('input');
      if (inp) inp.checked = true;
      responses[qid] = val;
      updateCard(qid);
    }

    function toggleCheckbox(el) {
      el.classList.toggle('selected');
      const inp = el.querySelector('input');
      if (inp) inp.checked = el.classList.contains('selected');
      const qid = el.dataset.qid;
      const checked = el.closest('.choice-group').querySelectorAll('.choice-option.selected');
      responses[qid] = Array.from(checked).map(o => o.dataset.val).join(',');
      updateCard(qid);
    }

    function selectScale(tile) {
      const qid = tile.dataset.qid;
      tile.closest('.scale-grid').querySelectorAll('.scale-tile').forEach(t => t.classList.remove('selected'));
      tile.classList.add('selected');
      responses[qid] = tile.dataset.val;
      updateCard(qid);
    }

    function attachListeners(q) {
      const wrap = document.getElementById(`qinput-${q.id}`);
      if (!wrap) return;
      const input = wrap.querySelector('input[type="text"], input[type="number"], textarea');
      if (input) {
        input.addEventListener('input', () => {
          responses[q.id] = input.value;
          updateCard(q.id);
        });
      }
    }

    function updateCard(qid) {
      const card = document.getElementById(`qcard-${qid}`);
      if (!card) return;
      if (responses[qid] && String(responses[qid]).trim()) {
        card.classList.add('answered');
        card.classList.remove('required-error');
      } else {
        card.classList.remove('answered');
      }
      updateProgress();
    }

    function updateProgress() {
      const answered = countAnswered();
      const total    = questions.length;
      const fill     = document.getElementById('progressFill');
      const label    = document.getElementById('progressLabel');
      const count    = document.getElementById('submitCount');
      if (fill)  fill.style.width  = `${pct(answered, total)}%`;
      if (label) label.textContent = `${answered} / ${total} answered`;
      if (count) count.textContent = `${answered}/${total}`;
    }

    // ── Submit ────────────────────────────────────────────────────────────────
    async function handleSubmit() {
      // Validate required fields
      let hasError = false;
      questions.forEach(q => {
        const card = document.getElementById(`qcard-${q.id}`);
        if (!card) return;
        if (q.is_required && (!responses[q.id] || !String(responses[q.id]).trim())) {
          card.classList.add('required-error');
          hasError = true;
        }
      });

      if (hasError) {
        // Scroll to first error
        const firstErr = document.querySelector('.question-card.required-error');
        if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const btn = document.getElementById('submitBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

      try {
        const res = await fetch(`${API_BASE_URL}/public/links/${token}/submit/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ consent_given: consentGiven, responses }),
        });
        const result = await res.json();
        if (result.success) {
          showSuccess();
        } else {
          if (btn) { btn.disabled = false; btn.textContent = '✓ Submit Responses'; }
          showInlineError(result.error || 'Submission failed. Please try again.');
        }
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = '✓ Submit Responses'; }
        showInlineError('Network error. Please check your connection and try again.');
      }
    }

    // ── Full-page states ──────────────────────────────────────────────────────
    function showSuccess() {
      document.getElementById('app').innerHTML = `
        <div class="full-screen" style="background:var(--bg);">
          <div class="state-card">
            <div class="state-icon">✅</div>
            <div class="state-title success">Thank You!</div>
            <p class="state-body">Your responses have been submitted successfully. Your contribution is greatly appreciated.</p>
            <p class="state-body" style="margin-top:12px;color:var(--stone-400);font-size:12px;">You may now close this page.</p>
          </div>
        </div>`;
    }

    function showError(msg) {
      document.getElementById('app').innerHTML = `
        <div class="full-screen" style="background:var(--bg);">
          <div class="state-card">
            <div class="state-icon">⚠️</div>
            <div class="state-title error">Something went wrong</div>
            <p class="state-body">${escHtml(msg)}</p>
          </div>
        </div>`;
    }

    function showExpired() {
      document.getElementById('app').innerHTML = `
        <div class="full-screen" style="background:var(--bg);">
          <div class="state-card">
            <div class="state-icon">🔒</div>
            <div class="state-title error">Link Expired or Inactive</div>
            <p class="state-body">This survey link has expired or is no longer active. Please contact the survey administrator for a new link.</p>
          </div>
        </div>`;
    }

    function showInlineError(msg) {
      let el = document.getElementById('inlineError');
      if (!el) {
        el = document.createElement('div');
        el.id = 'inlineError';
        el.style.cssText = 'background:#FEE2E2;border:1px solid #FCA5A5;color:#DC2626;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:12px;';
        const zone = document.querySelector('.submit-zone');
        if (zone) zone.insertAdjacentElement('beforebegin', el);
      }
      el.textContent = msg;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function countAnswered() {
      return questions.filter(q => responses[q.id] && String(responses[q.id]).trim()).length;
    }

    function requiredCount() {
      return questions.filter(q => q.is_required).length;
    }

    function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

    function formatType(t) {
      return (t || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function escAttr(s) {
      return String(s || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ── Start ─────────────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
